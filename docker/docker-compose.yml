services:
  postgres:
    image: postgres:15-alpine
    container_name: clyptus-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clyptus_recruitment

    ports:
      - "5434:5432"

    volumes:
      - clyptus-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d clyptus_recruitment" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clyptus-postgres-data: